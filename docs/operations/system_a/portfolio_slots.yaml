# 系統A — V1 + H4 T5 + 踏み上げ投げ切り
# 更新: 2026-05-31 — メイン2本復元

version: "2026-05-31"
system_id: system_a
system_name_ja: "系統A（TrendBreak V1 + H4 T5 + 踏み上げ投げ切り）"

overlap_resolution:
  rule: "t5_priority_same_symbol"
  note: |
    同一通貨で H4 T5 が OPEN またはシグナル済みの間は TrendBreak 新規を入れない。
    T5 終了後にスロットが空いたら TB は通常どおり。
    AUDJPY は TB も T5 も取引しない。
  sqz_note: |
    踏み上げ（SQZ）は T5 と同時保有重複 ≈ 0%。重なれば T5 優先。
    投げ切り（CAP）はインジ表示のみ・単独エントリーしない。

symbols_core:
  - XAUUSD
  - USDJPY
  - EURJPY
  - GBPJPY
  - CHFJPY
  - SILVER

charts:
  h1:
    pine: pine/production/TrendBreakV1_Final.pine
    preset: Auto
    symbols: [XAUUSD, USDJPY, EURJPY, GBPJPY, CHFJPY, SILVER]

  h4:
    layers:
      - id: t5
        tag: V字反転
        pine: pine/production/h4_t5_macd_bb_live_ready.pine
        type: strategy
        required: true
        symbols: [XAUUSD, USDJPY, EURJPY, GBPJPY, CHFJPY, SILVER]

      - id: cap_sqz_visual
        tag: 踏み上げ投げ切り
        pine: pine/visual/market_psychology_cap_sqz_visual.pine
        type: indicator
        required: true
        role: observe_only
        symbols: [XAUUSD, USDJPY, EURJPY, GBPJPY, CHFJPY, SILVER]

      - id: sqz_tv
        tag: 踏み上げ
        pine: pine/production/h4_sqz_tv_validation.pine
        type: strategy
        required: true
        symbols: [XAUUSD, USDJPY, SILVER]
        excluded_symbols: [EURJPY, GBPJPY, AUDJPY]
        risk_r:
          XAUUSD: 1.0
          SILVER: 1.0
          USDJPY: 0.25

      - id: b06_vis_precalm
        tag: 棚抜
        pine: pine/research/h4_v_initial_shelf_breakout_strategy.pine
        type: strategy
        system_b: B06_VIS_PRECALM
        required: true
        symbols: [USDJPY, EURJPY, GBPJPY, AUDJPY]
        trial_symbols: [XAUUSD, CHFJPY, SILVER]
        risk_r: 0.25
        trial_risk_r: 0.25
        note: "系統B。JPY4 H4の4本目。GBPJPYはPine5件が執行正。試験3銘柄は symbolMode=試験3銘柄・Pine照合前。"

lanes:
  - lane_id: A01_TB_H1
    tag: ブレイク追い
    pine: pine/production/TrendBreakV1_Final.pine
    timeframe: H1
    status: LIVE

  - lane_id: A02_T5_H4
    tag: V字反転
    pine: pine/production/h4_t5_macd_bb_live_ready.pine
    timeframe: H4
    status: LIVE

  - lane_id: A03_CAP_SQZ_VIS
    tag: 踏み上げ投げ切り
    pine: pine/visual/market_psychology_cap_sqz_visual.pine
    timeframe: H4
    status: LIVE
    role: observe_only

  - lane_id: A04_SQZ_TV
    tag: 踏み上げ
    pine: pine/production/h4_sqz_tv_validation.pine
    timeframe: H4
    status: LIVE
    role: strategy

  - lane_id: B06_VIS_PRECALM
    tag: 棚抜
    pine: pine/research/h4_v_initial_shelf_breakout_strategy.pine
    timeframe: H4
    status: FORWARD_0.25R
    role: strategy
    system_b: true
    symbols: [USDJPY, EURJPY, GBPJPY, AUDJPY]
    trial_symbols: [XAUUSD, CHFJPY, SILVER]
    trial_status: TRIAL_0.25R
