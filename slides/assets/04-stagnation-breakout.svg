<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="停滞からブレイク">
  <rect width="1200" height="680" fill="#141824" rx="24"/>
  <text x="600" y="60" fill="#ffd166" font-size="38" font-family="sans-serif" font-weight="700" text-anchor="middle">停滞パターン → ブレイク</text>
  <text x="600" y="105" fill="#8ecae6" font-size="24" font-family="sans-serif" text-anchor="middle">エネルギーを蓄えてから一方向へ動く</text>
  <rect x="100" y="150" width="1000" height="380" rx="16" fill="#1b2230" stroke="#4a5568" stroke-width="2"/>
  <path d="M140 420 L280 360 L420 300 L560 260" stroke="#118ab2" stroke-width="4" fill="none"/>
  <rect x="520" y="220" width="200" height="120" rx="8" fill="#243447" stroke="#ffd166" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="620" y="290" fill="#ffd166" font-size="22" font-family="sans-serif" font-weight="700" text-anchor="middle">停滞</text>
  <text x="620" y="318" fill="#e6e6e6" font-size="16" font-family="sans-serif" text-anchor="middle">7〜8本</text>
  <path d="M720 260 L860 180 L1000 120" stroke="#06d6a0" stroke-width="5" fill="none"/>
  <polygon points="1000,120 980,140 990,110" fill="#06d6a0"/>
  <text x="300" y="200" fill="#118ab2" font-size="20" font-family="sans-serif" text-anchor="middle">① トレンド</text>
  <text x="620" y="200" fill="#ffd166" font-size="20" font-family="sans-serif" text-anchor="middle">② 停滞（エネルギー蓄積）</text>
  <text x="900" y="160" fill="#06d6a0" font-size="20" font-family="sans-serif" font-weight="700" text-anchor="middle">③ ブレイク</text>
  <circle cx="720" cy="260" r="14" fill="#ef476f"/>
  <text x="760" y="280" fill="#ef476f" font-size="18" font-family="sans-serif" font-weight="700">エントリー</text>
  <rect x="180" y="560" width="840" height="70" rx="16" fill="#243447"/>
  <text x="600" y="605" fill="#e6e6e6" font-size="22" font-family="sans-serif" text-anchor="middle">「動き始めた後」ではなく「動く直前」の停滞を狙う</text>
</svg>