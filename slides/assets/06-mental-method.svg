<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="メンタルと手法のピラミッド">
  <rect width="1200" height="680" fill="#141824" rx="24"/>
  <text x="600" y="60" fill="#ffd166" font-size="38" font-family="sans-serif" font-weight="700" text-anchor="middle">メンタル × 手法</text>
  <text x="600" y="105" fill="#8ecae6" font-size="24" font-family="sans-serif" text-anchor="middle">どちらか一方だけでは勝ち続けられない</text>
  <polygon points="600,160 380,520 820,520" fill="#1b2230" stroke="#4a5568" stroke-width="3"/>
  <polygon points="600,160 480,320 720,320" fill="#241f2a" stroke="#9d4edd" stroke-width="3"/>
  <text x="600" y="260" fill="#9d4edd" font-size="28" font-family="sans-serif" font-weight="700" text-anchor="middle">メンタル</text>
  <text x="600" y="295" fill="#e6e6e6" font-size="18" font-family="sans-serif" text-anchor="middle">規律・我慢・感情排除</text>
  <polygon points="480,320 380,520 820,520 720,320" fill="#1f2a24" stroke="#06d6a0" stroke-width="3"/>
  <text x="600" y="430" fill="#06d6a0" font-size="32" font-family="sans-serif" font-weight="700" text-anchor="middle">手法</text>
  <text x="600" y="475" fill="#e6e6e6" font-size="20" font-family="sans-serif" text-anchor="middle">エントリー条件・損切り・利確ルール</text>
  <rect x="80" y="200" width="240" height="100" rx="12" fill="#2a1f1f" stroke="#ef476f" stroke-width="2"/>
  <text x="200" y="245" fill="#ef476f" font-size="20" font-family="sans-serif" font-weight="700" text-anchor="middle">手法だけ</text>
  <text x="200" y="275" fill="#e6e6e6" font-size="16" font-family="sans-serif" text-anchor="middle">→ 感情で崩れる</text>
  <rect x="880" y="200" width="240" height="100" rx="12" fill="#2a1f1f" stroke="#ef476f" stroke-width="2"/>
  <text x="1000" y="245" fill="#ef476f" font-size="20" font-family="sans-serif" font-weight="700" text-anchor="middle">メンタルだけ</text>
  <text x="1000" y="275" fill="#e6e6e6" font-size="16" font-family="sans-serif" text-anchor="middle">→ 再現性がない</text>
  <text x="600" y="620" fill="#ffd166" font-size="24" font-family="sans-serif" font-weight="700" text-anchor="middle">基盤（手法）の上に、規律（メンタル）を載せる</text>
</svg>