<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="根拠の4段階">
  <rect width="1200" height="680" fill="#141824" rx="24"/>
  <text x="600" y="60" fill="#ffd166" font-size="38" font-family="sans-serif" font-weight="700" text-anchor="middle">根拠の4段階</text>
  <text x="600" y="105" fill="#8ecae6" font-size="24" font-family="sans-serif" text-anchor="middle">再現性のない勝ちは最も危険</text>
  <rect x="200" y="520" width="800" height="70" rx="12" fill="#2a1f1f" stroke="#ef476f" stroke-width="3"/>
  <text x="600" y="565" fill="#ef476f" font-size="24" font-family="sans-serif" font-weight="700" text-anchor="middle">Lv.1  なんとなく・感覚</text>
  <rect x="250" y="430" width="700" height="70" rx="12" fill="#2a2418" stroke="#f4a261" stroke-width="3"/>
  <text x="600" y="475" fill="#f4a261" font-size="24" font-family="sans-serif" font-weight="700" text-anchor="middle">Lv.2  他人の手法を真似</text>
  <rect x="300" y="340" width="600" height="70" rx="12" fill="#1b2230" stroke="#118ab2" stroke-width="3"/>
  <text x="600" y="385" fill="#118ab2" font-size="24" font-family="sans-serif" font-weight="700" text-anchor="middle">Lv.3  自分で検証した結果</text>
  <rect x="350" y="250" width="500" height="70" rx="12" fill="#1f2a24" stroke="#06d6a0" stroke-width="4"/>
  <text x="600" y="295" fill="#06d6a0" font-size="24" font-family="sans-serif" font-weight="700" text-anchor="middle">Lv.4  再現性のある型</text>
  <path d="M150 560 L150 280" stroke="#ffd166" stroke-width="4"/>
  <polygon points="150,280 140,300 160,300" fill="#ffd166"/>
  <text x="100" y="420" fill="#ffd166" font-size="20" font-family="sans-serif" font-weight="700" text-anchor="middle" transform="rotate(-90 100 420)">レベル UP</text>
  <rect x="880" y="250" width="260" height="100" rx="12" fill="#2a1f1f" stroke="#ef476f" stroke-width="2"/>
  <text x="1010" y="295" fill="#ef476f" font-size="20" font-family="sans-serif" font-weight="700" text-anchor="middle">⚠ 危険</text>
  <text x="1010" y="325" fill="#e6e6e6" font-size="16" font-family="sans-serif" text-anchor="middle">Lv.1-2の勝ちは</text>
  <text x="1010" y="345" fill="#e6e6e6" font-size="16" font-family="sans-serif" text-anchor="middle">偶然に過ぎない</text>
  <text x="600" y="640" fill="#8ecae6" font-size="22" font-family="sans-serif" text-anchor="middle">エントリー前に「根拠はLv.何か？」を自問する</text>
</svg>